<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>给香菜诡秘的生日密件 · 12.01 🔐</title>
<style>
  :root {
    --paper: #fdf7ee;
    --paper-flap: #f7ebd9;
    --paper-front: #fbf2e4;
    --paper-edge: #e8d9bf;
    --seal: #d4526e;
    --ink: #4a3f35;
    --case: #1c2333;
    --case-2: #2a3348;
    --gold: #e8c56a;
    --clue: #7dd3a0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: linear-gradient(135deg, #a8c6ff 0%, #e8b7d4 42%, #ffd9a8 100%);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .45;
    pointer-events: none;
    z-index: 0;
  }
  body::before { width: 42vmax; height: 42vmax; background: #8fb8ff; top: -12vmax; left: -10vmax; }
  body::after  { width: 48vmax; height: 48vmax; background: #ffc9a0; bottom: -16vmax; right: -12vmax; }

  .stage {
    position: relative;
    width: 100%;
    height: 100dvh;
    z-index: 1;
  }

  /* ===== stage visibility: story → investigate → decode → card ===== */
  .story-screen, .invest-screen, .decode-screen { display: none !important; }
  body[data-stage="story"]       .story-screen  { display: grid !important; }
  body[data-stage="investigate"] .invest-screen { display: flex !important; }
  body[data-stage="decode"]      .decode-screen { display: grid !important; }
  body:not([data-stage="card"]) .stage { display: none; }
  body:not([data-stage="card"]) .hint,
  body:not([data-stage="card"]) .actions { display: none !important; }
  body[data-stage="story"] .credit,
  body[data-stage="investigate"] .credit,
  body[data-stage="decode"] .credit { color: rgba(255,255,255,.4); }

  /* ============ STORY ============ */
  .story-screen {
    position: fixed;
    inset: 0;
    z-index: 40;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(232, 197, 106, .12), transparent 55%),
      linear-gradient(165deg, #141a28 0%, var(--case) 45%, #12161f 100%);
    overflow: auto;
    touch-action: pan-y;
  }
  .case-file {
    width: min(440px, 100%);
    background: linear-gradient(180deg, #f7f1e4, #efe6d2);
    color: var(--ink);
    border-radius: 6px;
    padding: clamp(22px, 5vw, 34px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08);
    position: relative;
    transform: rotate(-.4deg);
    animation: file-in .7s cubic-bezier(.2, .9, .3, 1) both;
  }
  @keyframes file-in { from { opacity: 0; transform: rotate(-.4deg) translateY(26px); } }
  .case-file::before {
    content: "";
    position: absolute;
    top: 14px; right: 18px;
    width: 64px; height: 64px;
    border: 3px solid rgba(196, 60, 80, .55);
    border-radius: 50%;
  }
  .case-stamp {
    position: absolute;
    top: 26px; right: 22px;
    width: 56px; height: 56px;
    border: 2.5px solid rgba(196, 60, 80, .6);
    border-radius: 50%;
    color: rgba(196, 60, 80, .7);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .08em;
    display: grid;
    place-items: center;
    transform: rotate(12deg);
    text-align: center;
    line-height: 1.15;
    pointer-events: none;
  }
  .case-meta {
    font-size: 11px;
    letter-spacing: .22em;
    color: #8a7a5c;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .case-file h1 {
    font-size: clamp(22px, 6vw, 28px);
    letter-spacing: .06em;
    margin-bottom: 4px;
    color: #2c2418;
  }
  .case-sub {
    font-size: 13px;
    color: #7a6a4e;
    margin-bottom: 18px;
    letter-spacing: .12em;
  }
  .case-body {
    font-size: clamp(14px, 3.6vw, 15.5px);
    line-height: 1.85;
    color: #4a3f35;
    border-top: 1px dashed #c9b892;
    padding-top: 14px;
    margin-bottom: 22px;
  }
  .case-body p { animation: line-in .6s both; }
  .case-body p:nth-child(1) { animation-delay: .25s; }
  .case-body p:nth-child(2) { animation-delay: .55s; }
  .case-body p:nth-child(3) { animation-delay: .9s; }
  .case-body p:nth-child(4) { animation-delay: 1.25s; }
  .case-body p + p { margin-top: .75em; }
  @keyframes line-in { from { opacity: 0; transform: translateY(8px); } }
  .case-body .hl { color: #b03050; font-weight: 700; }
  .start-btn {
    width: 100%;
    border: none;
    background: linear-gradient(180deg, #2f3a52, #1e2638);
    color: #f0e6d0;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .18em;
    padding: 15px 20px;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.5);
    transition: transform .15s, filter .2s;
    animation: line-in .6s 1.5s both;
  }
  .start-btn:hover { filter: brightness(1.1); }
  .start-btn:active { transform: scale(.97); }
  .case-foot {
    margin-top: 14px;
    text-align: center;
    font-size: 11px;
    color: #9a8b6a;
    letter-spacing: .14em;
  }
  .case-file {
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    touch-action: pan-y;
  }

  /* ---- visual-novel dialogue ---- */
  .vn-box {
    border-top: 1px dashed #c9b892;
    padding-top: 14px;
    min-height: 170px;
    display: flex;
    flex-direction: column;
  }
  .vn-speaker {
    display: inline-block;
    align-self: flex-start;
    background: linear-gradient(180deg, #2f3a52, #1e2638);
    color: #f0e6d0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    padding: 4px 12px;
    border-radius: 4px 4px 0 0;
    margin-bottom: 0;
    animation: line-in .3s both;
  }
  .vn-text {
    background: rgba(255, 255, 255, .55);
    border: 1px solid #d9c9a4;
    border-top: none;
    border-radius: 0 8px 8px 8px;
    padding: 13px 14px;
    font-size: clamp(14px, 3.6vw, 15.5px);
    line-height: 1.85;
    color: #4a3f35;
    min-height: 96px;
    cursor: pointer;
    animation: line-in .3s .05s both;
  }
  .vn-text b { color: #b03050; }
  .vn-caret {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #b03050;
    margin-left: 2px;
    vertical-align: -0.12em;
    animation: caret-blink .8s steps(1) infinite;
  }
  @keyframes caret-blink { 50% { opacity: 0; } }
  .vn-choices {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 13px;
  }
  .vn-choice {
    text-align: left;
    border: 1.5px solid #c9b892;
    background: #fffdf6;
    color: #4a3f35;
    font: inherit;
    font-size: clamp(14px, 3.5vw, 15px);
    line-height: 1.55;
    padding: 12px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .12s;
    animation: line-in .4s both;
  }
  .vn-choice:hover {
    border-color: #b03050;
    background: #fdf3f5;
  }
  .vn-choice:active { transform: scale(.98); }
  .vn-choice.primary {
    background: linear-gradient(180deg, #2f3a52, #1e2638);
    border-color: transparent;
    color: #f0e6d0;
    font-weight: 700;
    letter-spacing: .12em;
    text-align: center;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.5);
  }
  .vn-choice.primary:hover { filter: brightness(1.12); background: linear-gradient(180deg, #2f3a52, #1e2638); }
  .vn-choice .tag-ok { color: #1f9d55; font-weight: 800; }
  .vn-choice .tag-no { color: #b03050; font-weight: 700; }
  .vn-skip {
    display: block;
    margin: 8px auto 0;
    border: none;
    background: none;
    color: #b0a080;
    font: inherit;
    font-size: 10.5px;
    letter-spacing: .16em;
    cursor: pointer;
    padding: 4px 8px;
    opacity: .75;
  }
  .vn-skip:hover { color: #b03050; opacity: 1; }

  /* ============ INVESTIGATE ============ */
  .invest-screen {
    position: fixed;
    inset: 0;
    z-index: 40;
    flex-direction: column;
    background: linear-gradient(180deg, #2a3148 0%, #3a3348 55%, #4a3a40 100%);
    touch-action: none;
  }
  .invest-hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 16px 8px;
    color: #f0e8d8;
    z-index: 5;
    flex: 0 0 auto;
  }
  .invest-title {
    font-size: clamp(13px, 3.2vw, 15px);
    letter-spacing: .12em;
    font-weight: 700;
  }
  .invest-title small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: .16em;
    color: rgba(240,232,216,.55);
    margin-top: 2px;
  }
  .clue-pill {
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(232,197,106,.45);
    color: var(--gold);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  /* evidence strip */
  .evidence-strip {
    display: flex;
    gap: 8px;
    padding: 0 14px 8px;
    overflow-x: auto;
    flex: 0 0 auto;
    z-index: 5;
    min-height: 0;
    scrollbar-width: none;
  }
  .evidence-strip:empty { display: none; }
  .evidence-strip::-webkit-scrollbar { display: none; }
  .ev-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(247, 241, 228, .12);
    border: 1px solid rgba(232,197,106,.5);
    color: #f0e6d0;
    font-size: 11.5px;
    letter-spacing: .06em;
    padding: 5px 11px;
    border-radius: 999px;
    white-space: nowrap;
    animation: chip-in .45s cubic-bezier(.2, 1.3, .4, 1) both;
    flex: 0 0 auto;
  }
  @keyframes chip-in { from { opacity: 0; transform: scale(.7); } }

  .room {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    margin: 0 12px 12px;
    border-radius: 14px;
    overflow: hidden;
    background:
      linear-gradient(180deg, #3d4660 0%, #3d4660 62%, #5a463c 62%, #4a3830 100%);
    box-shadow: inset 0 0 60px rgba(0,0,0,.35), 0 12px 30px -12px rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.08);
  }
  /* wall trim */
  .room::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 62%;
    height: 4px;
    background: linear-gradient(90deg, #6a5648, #7d6854, #6a5648);
    z-index: 1;
    pointer-events: none;
  }
  /* vignette */
  .room::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, transparent 40%, rgba(0,0,0,.38) 100%);
    pointer-events: none;
    z-index: 3;
  }

  /* furniture (decor only) */
  .furn { position: absolute; z-index: 2; pointer-events: none; }
  .furn-desk {
    left: 8%; right: 8%; bottom: 8%;
    height: 18%;
    background: linear-gradient(180deg, #8b6914, #6e5210);
    border-radius: 4px 4px 2px 2px;
    box-shadow: 0 8px 16px -6px rgba(0,0,0,.45);
  }
  .furn-desk::before {
    content: "";
    position: absolute;
    left: 6%; right: 6%; top: -10px;
    height: 12px;
    background: linear-gradient(180deg, #a07a1c, #8b6914);
    border-radius: 3px;
  }
  .furn-shelf {
    right: 6%; top: 10%;
    width: 22%; height: 38%;
    background: linear-gradient(90deg, #5c4030, #6e5040);
    border-radius: 3px;
    box-shadow: inset -4px 0 8px rgba(0,0,0,.25);
    border: 2px solid #4a3428;
  }
  .furn-shelf::before, .furn-shelf::after {
    content: "";
    position: absolute;
    left: 8%; right: 8%;
    height: 3px;
    background: #4a3428;
  }
  .furn-shelf::before { top: 32%; }
  .furn-shelf::after  { top: 64%; }
  .furn-window {
    left: 8%; top: 10%;
    width: 28%; height: 30%;
    background: linear-gradient(180deg, #8eb4e0, #c8dff2 60%, #9bb8d4);
    border: 4px solid #5a4a3c;
    border-radius: 2px;
    box-shadow: inset 0 0 20px rgba(255,255,255,.35);
  }
  .furn-window::before {
    content: "";
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 4px;
    background: #5a4a3c;
    transform: translateX(-50%);
  }
  .furn-window::after {
    content: "";
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 4px;
    background: #5a4a3c;
    transform: translateY(-50%);
  }
  .furn-plant {
    left: 6%; bottom: 28%;
    width: 12%; height: 22%;
  }
  .furn-plant::before {
    content: "🪴";
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(28px, 7vmin, 44px);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.35));
  }

  /* hotspots */
  .spot {
    position: absolute;
    z-index: 4;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    width: clamp(56px, 16vmin, 84px);
    height: clamp(56px, 16vmin, 84px);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: clamp(26px, 7vmin, 40px);
    line-height: 1;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.4));
    transition: transform .15s;
    touch-action: manipulation;
  }
  .spot::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(232, 197, 106, .75);
    animation: pulse 2s ease-out infinite;
    pointer-events: none;
  }
  .spot:hover { transform: scale(1.08); }
  .spot:active { transform: scale(.94); }
  .spot.found {
    opacity: .45;
    filter: grayscale(.4) drop-shadow(0 2px 4px rgba(0,0,0,.3));
  }
  .spot.found::before { animation: none; opacity: 0; }
  .spot .tag {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: .06em;
    color: rgba(255,255,255,.85);
    background: rgba(0,0,0,.45);
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
    font-family: inherit;
    pointer-events: none;
  }
  @keyframes pulse {
    0%   { transform: scale(.85); opacity: .9; }
    70%  { transform: scale(1.2); opacity: 0; }
    100% { transform: scale(1.2); opacity: 0; }
  }

  .spot-calendar  { left: 12%; top: 14%; }
  .spot-frame     { left: 42%; top: 12%; }
  .spot-notebook  { left: 30%; bottom: 22%; }
  .spot-lamp      { right: 30%; bottom: 24%; }
  .spot-books     { right: 8%; top: 16%; }

  /* envelope hotspot — hidden until enough clues */
  .spot-envelope {
    left: 50%; top: 48%;
    transform: translate(-50%, -50%);
    width: clamp(72px, 20vmin, 100px);
    height: clamp(72px, 20vmin, 100px);
    font-size: clamp(36px, 10vmin, 54px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s, transform .5s;
  }
  .spot-envelope::before { border-color: rgba(212, 82, 110, .85); }
  .spot-envelope.ready {
    opacity: 1;
    pointer-events: auto;
    animation: env-glow 1.6s ease-in-out infinite;
  }
  .spot-envelope.ready:hover { transform: translate(-50%, -50%) scale(1.08); }
  .spot-envelope.ready:active { transform: translate(-50%, -50%) scale(.94); }
  @keyframes env-glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(212,82,110,.55)); }
    50%      { filter: drop-shadow(0 0 22px rgba(212,82,110,.95)); }
  }

  .spot-envelope .tag { bottom: -6px; color: #ffd6e0; }

  /* toast */
  .clue-toast {
    position: absolute;
    left: 50%; bottom: 18px;
    transform: translateX(-50%) translateY(20px);
    width: min(92%, 400px);
    background: rgba(18, 22, 34, .92);
    color: #f0e8d8;
    border: 1px solid rgba(232,197,106,.35);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: clamp(13px, 3.4vw, 14.5px);
    line-height: 1.65;
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,.55);
  }
  .clue-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .clue-toast strong {
    display: block;
    color: var(--gold);
    font-size: 12px;
    letter-spacing: .16em;
    margin-bottom: 6px;
  }
  .clue-toast .ok { color: var(--clue); font-weight: 700; }
  .clue-toast .warn { color: #f0a0b0; font-weight: 700; }

  /* clue story panel — multi-line dialogue over the room */
  .clue-panel {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 8;
    background: linear-gradient(180deg, #f7f1e4, #efe6d2);
    color: var(--ink);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 -12px 34px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.12);
    max-height: 62%;
    overflow-y: auto;
    touch-action: pan-y;
    animation: line-in .3s both;
  }
  .clue-panel[hidden] { display: none; }
  .clue-panel .vn-text {
    cursor: default;
    min-height: 54px;
    background: rgba(255,255,255,.6);
  }
  .clue-next {
    display: block;
    margin: 10px auto 0;
    border: none;
    background: linear-gradient(180deg, #2f3a52, #1e2638);
    color: #f0e6d0;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .16em;
    padding: 9px 22px;
    border-radius: 999px;
    cursor: pointer;
    animation: line-in .3s both;
  }
  .clue-next:active { transform: scale(.96); }
  .clue-next[hidden] { display: none; }
  .clue-panel .vn-choice { animation-duration: .3s; }

  /* ============ DECODE / KEYPAD ============ */
  .decode-screen {
    position: fixed;
    inset: 0;
    z-index: 45;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(ellipse 70% 50% at 50% 15%, rgba(212, 82, 110, .14), transparent 60%),
      linear-gradient(165deg, #10141f 0%, var(--case) 55%, #0c0f17 100%);
    overflow: auto;
    touch-action: pan-y;
  }
  .decode-box {
    width: min(360px, 100%);
    text-align: center;
    color: #efe6d2;
    animation: file-in .55s cubic-bezier(.2, .9, .3, 1) both;
  }
  .decode-box .mini-seal {
    width: clamp(72px, 20vmin, 96px);
    height: clamp(72px, 20vmin, 96px);
    margin: 0 auto 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ef7f97, var(--seal) 55%, #a83a54);
    box-shadow: 0 12px 30px -8px rgba(140, 40, 70, .7), inset 0 3px 6px rgba(255,255,255,.4);
    display: grid;
    place-items: center;
    font-size: clamp(32px, 9vmin, 44px);
  }
  .decode-box h2 {
    font-size: clamp(19px, 5vw, 23px);
    letter-spacing: .12em;
    margin-bottom: 6px;
    color: #f4ecd8;
  }
  .decode-box .hint-line {
    font-size: clamp(13px, 3.4vw, 14px);
    line-height: 1.7;
    color: rgba(240,232,216,.7);
    letter-spacing: .05em;
    margin-bottom: 18px;
  }
  .decode-box .hint-line b { color: var(--gold); }
  .code-display {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .code-slot {
    width: clamp(46px, 13vw, 56px);
    height: clamp(54px, 15vw, 64px);
    background: rgba(0,0,0,.45);
    border: 1.5px solid rgba(232,197,106,.45);
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-size: clamp(24px, 7vw, 30px);
    font-weight: 800;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .code-slot.filled {
    border-color: var(--gold);
    box-shadow: 0 0 14px -4px rgba(232,197,106,.7);
    animation: slot-pop .25s cubic-bezier(.2, 1.4, .4, 1);
  }

  /* ============ Envelope / Card (existing flow) ============ */
  .envelope {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    cursor: pointer;

    z-index: 2;

  @keyframes env-in {
    from { opacity: 0; transform: translate(-50%, -42%) scale(.86); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes env-float {
    0%, 100% { margin-top: 0; }
    50%      { margin-top: -10px; }

  .env-back {
    position: absolute;
    inset: 0;
    background: linear-gradient(175deg, #f3e6d0, #eeddc2);

    border-radius: 10px;
    box-shadow: 0 24px 50px -18px rgba(90, 60, 40, .45);
    z-index: 1;
  }

  .env-front {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 55%;
    background: linear-gradient(180deg, var(--paper-front), #f4e5cd);
    clip-path: polygon(0 14%, 50% 0, 100% 14%, 100% 100%, 0 100%);
    z-index: 3;
    pointer-events: auto;
  }
  .env-front::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.06), transparent 30%);
    pointer-events: none;
  }

  .flap {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 54%;
    background: linear-gradient(185deg, var(--paper-flap), #efdcc0);
    clip-path: polygon(0 0, 100% 0, 50% 100%);

    transform: rotateX(0deg);
    transition: transform .75s cubic-bezier(.45, .05, .2, 1), z-index 0s .38s;
    z-index: 4;
    backface-visibility: visible;
    pointer-events: auto;
  }
  .flap::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.35), transparent 55%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }

  .seal {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: clamp(52px, 11vmin, 72px);
    height: clamp(52px, 11vmin, 72px);

    z-index: 5;

    pointer-events: none;

  [data-state="floating"] .flap {
    transform: rotateX(180deg);
    z-index: 0;
    transition: transform .75s cubic-bezier(.45, .05, .2, 1), z-index 0s .38s;
  }
  [data-state="opening"] .seal,
  [data-state="opened"] .seal,
  [data-state="floating"] .seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.5);

  [data-state="floating"] .envelope {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -40%) scale(.94);
    transition: opacity .6s .15s, transform .6s .15s, visibility 0s .8s;
    animation: none;
  }

  .card-holder {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 92%;
    perspective: 1400px;
    z-index: 2;
    pointer-events: none;
    opacity: 0;

  }

  [data-state="opening"] .card-holder,
  [data-state="opened"] .card-holder {
    opacity: 1;
  }
  [data-state="opened"] .card-holder {
    pointer-events: auto;
    cursor: grab;
    transform: translate(-50%, calc(-50% - 17%));
  }
  .card-holder.dragging { transition: none; cursor: grabbing; }

  .card-holder.docked {
    position: fixed;
    inset: 0;
    left: 0; top: 0; right: 0; bottom: 0;
    margin: auto;
    width: min(88vw, 760px);
    height: max-content;
    transform: none;
    z-index: 20;
    pointer-events: auto;
    cursor: grab;
  }
  .card-holder.docked.dragging { cursor: grabbing; }

  .card-inner {
    position: relative;
    width: 100%;

    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2, .8, .2, 1);
  }
  .card-inner.dragging { transition: none; }

  .card-face {
    position: absolute;
    inset: 0;

  /* ============ UI ============ */
  .hint {

  .actions {

  }

  .download-btn {
    border: none;
    background: rgba(255, 255, 255, .9);
    color: var(--ink);
    font: inherit;
    font-size: clamp(13px, 2.6vmin, 15px);

    padding: 11px 22px;

    box-shadow: 0 10px 26px -8px rgba(80, 50, 40, .45);

    white-space: nowrap;
  }
  .download-btn:hover { background: #fff; }
  .download-btn:active { transform: scale(.96); }

  .corner-note {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.92);
    font-size: clamp(12px, 2.4vmin, 14px);
    letter-spacing: .18em;

    z-index: 30;
    pointer-events: none;
  }

  .credit {
    position: fixed;
    left: 50%;
    bottom: max(8px, calc(env(safe-area-inset-bottom) + 8px));
    transform: translateX(-50%);
    color: rgba(255, 255, 255, .72);
    font-size: clamp(10px, 2vmin, 12px);
    letter-spacing: .1em;
    text-shadow: 0 1px 6px rgba(80, 50, 60, .3);
    z-index: 50;
    pointer-events: none;
    white-space: nowrap;
  }

  .confetti {
    position: fixed;
    left: 0; top: 0;
    font-size: clamp(18px, 3.4vmin, 26px);
    pointer-events: none;
    z-index: 45;
    animation: confetti-fall 1.6s cubic-bezier(.2, .6, .4, 1) forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translate(0, 0) rotate(0deg) scale(.6); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .envelope { animation: none; }
    .hint { animation: none; }

    .spot-envelope.ready { animation: none; }

  @media (max-height: 500px) and (orientation: landscape) {

  }
</style>

<script>
(() => {

  /* ---- room story scenes: each object plays a multi-line dialogue ----
     lines: { speaker, text, choices?: [{ label, reply:{speaker,text}|null, next?:idx }] }
     choices with `bad: true` show a reply then re-render the same choices. */

    calendar: {
      icon: "📅",
      chip: "日历",
      objective: "先看看墙上挂着的日历",

        { speaker: "你", text: "墙上的日历翻到 12 月——<b>1 号被红笔圈了三圈</b>，旁边还有一个字：<b>「今」</b>。" },

        { speaker: "旁白", text: "第一段回忆：<b>12 月 1 日</b>——故事的起点，也是密码的起点。" },

    },
    frame: {
      icon: "🖼️",
      chip: "相框",
      objective: "看看桌上那张相框",
      lines: [
        { speaker: "你", text: "玻璃相框里是两张笑得毫无形象的脸——其中一张嘴角还挂着奶茶渍。" },

        { speaker: "你", text: "「最好的闺蜜」……行吧，看在这行字的份上，奶茶渍的事不跟你计较。",
          choices: [
            { label: "「这张照片什么时候拍的？」", reply: { speaker: "黄师傅", text: "我们去泉州簪花那次呀——是叶子女王帮我们拍的。你顶着满头的花，笑得比花还张扬。" } },

          ] },
        { speaker: "旁白", text: "第二段回忆：<b>最好的闺蜜</b>——有人把这四个字，郑重其事地压在了玻璃后面。" },
      ],
    },
    notebook: {
      icon: "📓",
      chip: "笔记本",
      objective: "翻开桌上摊开的笔记本",
      lines: [
        { speaker: "你", text: "摊开的一页上是黄师傅龙飞凤舞的字：<b>「礼物藏在房间最中央——别被日常晃了眼。」</b>" },
        { speaker: "黄师傅", text: "写这么明显还看不懂？<b>最中央</b>，就是你每天路过、却从来不多看一眼的地方。" },
        { speaker: "你", text: "最中央……这屋子的正中间，不就是……",
          choices: [
            { label: "「书桌上？」", reply: { speaker: "黄师傅", text: "书桌偏了三寸——不过方向对了，继续找。" } },
            { label: "「房间正中间！」", reply: { speaker: "黄师傅", text: "Bingo。到时候别盯家具，<b>盯空气</b>。" } },

        { speaker: "旁白", text: "第三段回忆：<b>最中央</b>——一句指向房间正心的暗示。" },

      objective: "摸摸台灯，看看灯罩下面",
      lines: [
        { speaker: "你", text: "灯罩下压着一张便签，纸边被烤得微微发黄：<b>「找到粉红封印了吗？集齐五段回忆，它就会出现。」</b>" },
        { speaker: "黄师傅", text: "五段回忆——日历、相框、笔记本、台灯、书。你现在读到第几段了？" },
        { speaker: "你", text: "第四段。……你连这个都算好了？",
          choices: [
            { label: "「便签为什么是烤过的？」", reply: { speaker: "黄师傅", text: "复古做旧，懂吗。重要的纸都得有做旧感——仪式感。" } },
            { label: "「集齐之后会怎样？」", reply: { speaker: "黄师傅", text: "集齐之后——<b>信会自己来找你</b>。别眨眼。" } },
          ] },
        { speaker: "旁白", text: "第四段回忆：<b>粉红封印的咒语</b>——五段集齐，密信自会现身。" },
      ],
    },
    books: {
      icon: "📚",
      chip: "书架",
      objective: "抽一本最旧的书——《泰山揽胜⛰️》",
      lines: [
        { speaker: "你", text: "书架上抽出一本《泰山揽胜⛰️》，扉页是黄师傅的字：<b>「黄师傅到此一游——生日快乐！」</b>书里还夹着半张卡片。" },
        { speaker: "黄师傅", text: "卡片上是残缺的暗语，补全它，这屋里的事就全说通了：<br>「先集齐五段回忆，______。」", choices: [
          { label: "「礼物就会长腿跑掉」", bad: true, reply: { speaker: "黄师傅", text: "礼物又不是猫，长不了腿……重补。" } },
          { label: "「密信自会现身」", reply: { speaker: "黄师傅", text: "正确！<b>「先集齐五段回忆，密信自会现身。」</b>——咒语成立，就差最后一口气了。" } },
          { label: "「奶茶就要凉了」", bad: true, reply: { speaker: "黄师傅", text: "……你今天跟奶茶过不去了是吧。重补。" } },
        ] },
        { speaker: "旁白", text: "第五段回忆：<b>暗语补全</b>——话音刚落，房间正中央的空气，轻轻漾了一下。" },
      ],
    },
    envelope: {
      icon: "✉️",
      chip: "密信",
      objective: "点开房间正中央的密信",
      lines: [
        { speaker: "旁白", text: "一封<b>粉红火漆</b>封印的信从空气里浮了出来，稳稳落进你掌心——火漆还带着温度。" },
        { speaker: "黄师傅", text: "「集齐五段回忆，密信自会现身」——现在，它现身了。开吧，寿星。" },
        { speaker: "你", text: "等等，火漆上锁着……四位密码。提示呢？" },
        { speaker: "黄师傅", text: "提示？<b>第一段回忆</b>里就写给你了——你最该记住的那天。按下去。" },
      ],
    },
  };
  const SCENE_ORDER = ["calendar", "frame", "notebook", "lamp", "books"];

  /* ================= STAGE MACHINE ================= */
  function setStage(name) {
    body.dataset.stage = name;
    if (name === "card") {
      hint.textContent = HINTS.closed;
      hint.hidden = false;
    }
  }

  /* ================= INTERACTIVE STORY (VN) ================= */
  const vnSpeaker = document.getElementById("vnSpeaker");
  const vnText = document.getElementById("vnText");
  const vnChoices = document.getElementById("vnChoices");
  const vnSkip = document.getElementById("vnSkip");

  function birthdayLine() {
    return "今天，12 月 1 日，就是你的生日！";
  }

  const STORY = {
    /* ============ 序章 · 剧情分支 ============ */
    intro: {
      speaker: "黄师傅 · 加密留言",
      text: `调查员 <b>香菜诡秘</b>：当你读到这封密件时，${birthdayLine()}我，黄师傅，把一份「神秘礼物」藏进了这间屋子。但规矩是——先证明你配得上它。`,
      choices: [
        { label: "「谁稀罕……我偏要找到给你看！」", next: "r_bone" },
        { label: "「黄师傅又在故弄玄虚？」", next: "r_tease" },
        { label: "「找到的话，奶茶你请！」", next: "r_milk" },
      ],
    },
    r_bone: {
      speaker: "你",
      text: "很好，有骨气。不过上次是谁把保险箱密码猜错三次来着？……是是是，那都是意外。",
      choices: [{ label: "别翻旧账了，说正事！", next: "briefing" }],
    },
    r_tease: {
      speaker: "你",
      text: "故弄玄虚？这叫仪式感，侦探小姐。没有仪式感的礼物，和咸鱼有什么区别。",
      choices: [{ label: "行行行，规矩是什么？", next: "briefing" }],
    },
    r_milk: {
      speaker: "你",
      text: "成交！不过前提是你得找得到——找不到的话，奶茶自己买。",
      choices: [{ label: "谁怕谁，带路！", next: "briefing" }],
    },

    /* ============ 任务简报 → 进入现场 ============ */
    briefing: {
      speaker: "黄师傅 · 任务简报",
      text: "听好，故事是这样的：<b>这间屋里藏着五段回忆</b>——日历、相框、笔记本、台灯、书。<br>按顺序把它们一段段读完，<b>密信自会现身</b>；至于密码……<b>你最该记住的那天</b>，四位数。<br>去吧，从墙上那本日历开始。",
      choices: [{ label: "🔍 出发 · 开始调查", next: "__start__", primary: true }],
    },
  };

  let typeTimer = null;
  let typeDone = null;
  let typeFull = "";
  let typeEl = null;

  function typeHtml(el, html, done) {
    clearTimeout(typeTimer);
    typeEl = el;
    typeFull = html;
    typeDone = done;
    el.innerHTML = "";
    const tokens = html.match(/<[^>]+>|[\s\S]/g) || [];
    let i = 0;
    let buf = "";
    const step = () => {
      if (i >= tokens.length) {
        el.innerHTML = buf;
        const d = typeDone;
        typeDone = null;
        if (d) d();
        return;
      }
      const t = tokens[i++];
      buf += t;
      el.innerHTML = buf + '<span class="vn-caret"></span>';
      typeTimer = setTimeout(step, t.charAt(0) === "<" ? 0 : 16);
    };
    step();
  }

  function skipType() {
    if (!typeDone) return;
    clearTimeout(typeTimer);
    typeEl.innerHTML = typeFull;
    const d = typeDone;
    typeDone = null;
    if (d) d();
  }
  vnText.addEventListener("click", skipType);

  function showNode(id) {
    const node = STORY[id];
    if (!node) return;
    vnChoices.innerHTML = "";
    vnSpeaker.textContent = node.speaker;
    const text = typeof node.text === "function" ? node.text() : node.text;
    typeHtml(vnText, text, () => renderChoices(node.choices));
  }

  function renderChoices(choices) {
    vnChoices.innerHTML = "";
    choices.forEach((c, idx) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "vn-choice" + (c.primary ? " primary" : "");
      b.textContent = c.label;
      b.style.animationDelay = idx * 0.07 + "s";
      b.addEventListener("click", () => {
        if (c.next === "__start__") {
          setStage("investigate");
          return;
        }
        showNode(c.next);
      });
      vnChoices.appendChild(b);
    });
  }

  vnSkip.addEventListener("click", () => setStage("investigate"));

  /* ================= INVESTIGATE (ordered story scenes) ================= */
  function showToast(html) {
    clueToast.innerHTML = html;
    clueToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => clueToast.classList.remove("show"), 3600);
  }

  const cluePanel = document.getElementById("cluePanel");
  const clueSpeaker = document.getElementById("clueSpeaker");
  const clueText = document.getElementById("clueText");
  const clueChoices = document.getElementById("clueChoices");
  const clueNext = document.getElementById("clueNext");
  clueText.addEventListener("click", skipType);

  let sceneQueue = [];
  let sceneOnDone = null;
  let activeScene = null;

  function updateObjective() {
    investObjective.textContent = stepIdx < NEED
      ? SCENES[SCENE_ORDER[stepIdx]].objective
      : "五段回忆已集齐——点开房间正中央的密信";
  }

  function openScene(key, onDone) {
    const scene = SCENES[key];
    if (!scene) return;
    activeScene = key;
    sceneQueue = scene.lines.slice();
    sceneOnDone = onDone || null;
    cluePanel.hidden = false;
    clueChoices.innerHTML = "";
    clueNext.hidden = true;
    nextSceneLine();
  }

  function nextSceneLine() {
    clueChoices.innerHTML = "";
    clueNext.hidden = true;
    const line = sceneQueue.shift();
    if (!line) { finishScene(); return; }
    clueSpeaker.textContent = line.speaker;
    typeHtml(clueText, line.text, () => {
      if (line.choices) renderSceneChoices(line.choices);
      else clueNext.hidden = false;
    });
  }

  function renderSceneChoices(choices) {
    clueChoices.innerHTML = "";
    choices.forEach((c, idx) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "vn-choice";
      b.textContent = c.label;
      b.style.animationDelay = idx * 0.07 + "s";
      b.addEventListener("click", () => {
        clueChoices.innerHTML = "";
        const after = () => {
          if (c.bad) renderSceneChoices(choices); // wrong pick → re-ask
          else clueNext.hidden = false;
        };
        if (c.reply) {
          clueSpeaker.textContent = c.reply.speaker;
          typeHtml(clueText, c.reply.text, after);
        } else after();
      });
      clueChoices.appendChild(b);
    });
  }

  clueNext.addEventListener("click", nextSceneLine);

  function finishScene() {
    cluePanel.hidden = true;
    const done = sceneOnDone;
    activeScene = null;
    sceneOnDone = null;
    sceneQueue = [];
    if (done) done();
  }

  investScreen.addEventListener("click", (e) => {
    if (!cluePanel.hidden) return; // dialogue is open — panel buttons handle input
    const spot = e.target.closest(".spot");
    if (!spot) return;
    const key = spot.dataset.clue;

    if (key === "envelope") {
      if (stepIdx < NEED || !envelopeSpot.classList.contains("ready")) {
        showToast(`<strong>还早呢</strong><span class="warn">${investObjective.textContent}</span>`);
        return;
      }
      if (found.has("envelope")) return;
      spot.classList.add("found");
      found.add("envelope");
      burstConfetti();
      openScene("envelope", () => {
        setStage("decode");
        resetCode();
      });
      return;
    }

    const required = SCENE_ORDER[stepIdx];
    if (key !== required) {
      const hint = found.has(key)
        ? "这段回忆你已经读过了"
        : SCENES[required].objective;
      showToast(`<strong>先等等</strong><span class="warn">${hint}</span>`);
      return;
    }

    /* next scene in the story line */
    spot.classList.add("found");
    found.add(key);
    const scene = SCENES[key];
    openScene(key, () => {
      clueCountEl.textContent = String(found.size);
      const chip = document.createElement("span");
      chip.className = "ev-chip";
      chip.textContent = `${scene.icon} ${scene.chip}`;
      evidenceStrip.appendChild(chip);
      stepIdx++;
      if (stepIdx >= NEED) {
        investObjective.textContent = "五段回忆已集齐——点开房间正中央的密信";
        envelopeSpot.classList.add("ready");
        envelopeSpot.disabled = false;
        showToast(`<strong>五段回忆集齐</strong>房间正中央的空气漾了一下……<span class="ok">✉️ 密信现身了！</span>`);
        burstConfetti();
      } else {
        updateObjective();
      }
    });
  });

  updateObjective();

  /* ================= DECODE KEYPAD ================= */
  const CODE = "1201"; // 12月1日 MMDD
  const codeSlots = Array.from(document.querySelectorAll("#codeDisplay .code-slot"));
  const codeDisplay = document.getElementById("codeDisplay");
  const codeMsg = document.getElementById("codeMsg");
  const keypad = document.getElementById("keypad");
  let entered = "";

  function renderCode() {
    codeSlots.forEach((slot, i) => {
      const ch = entered[i];
      slot.textContent = ch != null ? ch : "_";
      slot.classList.toggle("filled", ch != null);
    });
  }

  function resetCode() {
    entered = "";
    codeMsg.textContent = "";
    renderCode();
  }

  function checkCode() {
    if (entered === CODE) {
      codeMsg.style.color = "var(--clue)";
      codeMsg.textContent = "✓ 密码正确——火漆熔化了！";
      burstConfetti();
      setTimeout(() => setStage("card"), 800);
    } else {
      codeMsg.style.color = "#f0a0b0";
      codeMsg.textContent = "✗ 密码不对——想想线索里的日期。";
      codeDisplay.classList.remove("shake");
      void codeDisplay.offsetWidth;
      codeDisplay.classList.add("shake");
      entered = "";
      renderCode();
    }
  }

  keypad.addEventListener("click", (e) => {
    const btn = e.target.closest(".key");
    if (!btn) return;
    const k = btn.dataset.k;

    if (k === "del") {
      entered = entered.slice(0, -1);
      renderCode();
      return;
    }
    if (k === "ok") {
      if (entered.length === 4) checkCode();
      else {
        codeMsg.style.color = "#f0a0b0";
        codeMsg.textContent = "请输入 4 位数字。";
      }
      return;
    }
    if (entered.length < 4) {
      entered += k;
      renderCode();
      if (entered.length === 4) setTimeout(checkCode, 320);
    }
  });

  /* ================= CARD FLOW ================= */
  const envelope = document.getElementById("envelope");
  const cardHolder = document.getElementById("cardHolder");
  const cardInner = document.getElementById("cardInner");
  const downloadFront = document.getElementById("downloadFront");
  const downloadBack = document.getElementById("downloadBack");

  let state = "closed";
  let rotY = 0, rotX = 0;

  function setState(s) {
    state = s;
    body.dataset.state = s;
    hint.textContent = HINTS[s] || "";
    hint.hidden = false;
  }

  function openEnvelope() {
    if (body.dataset.stage !== "card") return;
    if (state !== "closed") return;
    setState("opening");
    setTimeout(() => { if (state === "opening") setState("opened"); }, 780);
  }
  envelope.addEventListener("click", openEnvelope);
  envelope.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); }
  });

  let mode = null;
  let lastX = 0, lastY = 0;
  let startY = 0;
  let pullPx = 0;
  let moved = 0;

  const peekY = () => -cardHolder.offsetHeight * 0.17;

  function applyPull(px) {
    pullPx = px;
    cardHolder.style.transform =
      `translate(-50%, calc(-50% + ${peekY()}px + ${px}px))`;
  }

  function completePull() {
    const first = cardHolder.getBoundingClientRect();
    document.getElementById("stage").appendChild(cardHolder);
    cardHolder.classList.add("docked");
    cardHolder.style.transition = "none";
    cardHolder.style.transform = "";
    cardHolder.style.opacity = "1";

    setState("floating");

    const last = cardHolder.getBoundingClientRect();
    const dx = first.left - last.left;
    const dy = first.top - last.top;
    const s  = first.width / last.width;

    cardHolder.style.transformOrigin = "top left";
    cardHolder.style.transform = `translate(${dx}px, ${dy}px) scale(${s})`;

    requestAnimationFrame(() => {
      cardHolder.style.transition = "transform .75s cubic-bezier(.2, .85, .25, 1)";
      cardHolder.style.transform = "translate(0px, 0px) scale(1)";
      setTimeout(() => {
        cardHolder.style.transition = "";
        cardHolder.style.transformOrigin = "";
        cardHolder.style.transform = "";
      }, 800);
    });

    burstConfetti();
  }

  function springBack() {
    cardHolder.style.transform = "";
    pullPx = 0;
  }

  function applyRotation() {
    cardInner.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  function snapRotation() {
    rotY = Math.round(rotY / 180) * 180;
    rotX = 0;
    applyRotation();
  }

  function flip() {
    rotY = Math.round(rotY / 180) * 180 + 180;
    rotX = 0;
    applyRotation();
  }

  function downloadImage(href, name) {
    const a = document.createElement("a");
    a.href = href;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  downloadFront.addEventListener("click", (e) => {
    e.stopPropagation();
    downloadImage("正面.jpg", "贺卡-正面.jpg");
  });
  downloadBack.addEventListener("click", (e) => {
    e.stopPropagation();
    downloadImage("反面.jpg", "贺卡-反面.jpg");
  });

  cardHolder.addEventListener("pointerdown", (e) => {
    if (body.dataset.stage !== "card") return;
    if (state === "opened") {
      mode = "pull";
      startY = e.clientY;
      pullPx = 0;
      moved = 0;
      lastX = e.clientX; lastY = e.clientY;
      cardHolder.classList.add("dragging");
      cardHolder.style.transition = "none";
      cardHolder.setPointerCapture(e.pointerId);
    } else if (state === "floating") {
      mode = "rotate";
      lastX = e.clientX; lastY = e.clientY;
      moved = 0;
      cardHolder.classList.add("dragging");
      cardInner.classList.add("dragging");
      cardHolder.setPointerCapture(e.pointerId);
    }
  });

  cardHolder.addEventListener("pointermove", (e) => {
    if (!mode) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);

    if (mode === "pull") {
      const delta = e.clientY - startY;
      applyPull(Math.min(0, delta));
    } else if (mode === "rotate") {
      rotY += dx * 0.55;
      rotX = Math.max(-28, Math.min(28, rotX - dy * 0.25));
      applyRotation();
      lastX = e.clientX; lastY = e.clientY;
    }
  });

  function endPointer(e) {
    if (!mode) return;
    const m = mode;
    mode = null;

    if (m === "pull") {
      cardHolder.classList.remove("dragging");
      cardHolder.style.transition = "";
      const cardH = cardHolder.offsetHeight;
      if (moved < 10) {
        completePull();
      } else if (-pullPx > cardH * 0.38) {
        completePull();
      } else {
        springBack();
      }
    } else if (m === "rotate") {
      cardHolder.classList.remove("dragging");
      cardInner.classList.remove("dragging");
      if (moved < 8) {
        flip();
      } else {
        snapRotation();
      }
    }
  }
  cardHolder.addEventListener("pointerup", endPointer);
  cardHolder.addEventListener("pointercancel", endPointer);

  function burstConfetti() {
    const emojis = ["🎂", "✨", "🎀", "🥳", "💛", "🌸", "🎉"];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 26; i++) {
      const el = document.createElement("span");
      el.className = "confetti";
      el.textContent = emojis[i % emojis.length];
      const angle = (Math.PI * 2 * i) / 26 + Math.random() * 0.5;
      const dist = 120 + Math.random() * 220;
      el.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
      el.style.setProperty("--dy", `${Math.sin(angle) * dist * 0.7 + 140}px`);
      el.style.setProperty("--rot", `${(Math.random() * 540 - 270) | 0}deg`);
      el.style.left = cx + (Math.random() * 80 - 40) + "px";
      el.style.top = cy + (Math.random() * 40 - 20) + "px";
      el.style.animationDelay = Math.random() * 0.15 + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }
  }

  applyRotation();

  /* ================= BOOT ================= */
  showNode("intro");
})();
</script>
</body>
</html>
