<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>给香菜诡秘的生日密件 🕵️</title>
<style>
  :root {
    --paper: #fdf7ee;
    --paper-flap: #f7ebd9;
    --paper-front: #fbf2e4;
    --paper-edge: #e8d9bf;
    --seal: #d4526e;
    --ink: #4a3f35;
    --case: #1c2333;
    --case-2: #2a3348;
    --gold: #e8c56a;
    --clue: #7dd3a0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: linear-gradient(135deg, #a8c6ff 0%, #e8b7d4 42%, #ffd9a8 100%);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .45;
    pointer-events: none;
    z-index: 0;
  }
  body::before { width: 42vmax; height: 42vmax; background: #8fb8ff; top: -12vmax; left: -10vmax; }
  body::after  { width: 48vmax; height: 48vmax; background: #ffc9a0; bottom: -16vmax; right: -12vmax; }

  .stage {
    position: relative;
    width: 100%;
    height: 100dvh;
    z-index: 1;
  }

  /* stage visibility: story → investigate → card */
  body:not([data-stage="card"]) .stage { display: none; }
  body[data-stage="card"] .story-screen,
  body[data-stage="card"] .invest-screen { display: none !important; }
  body:not([data-stage="investigate"]) .invest-screen { display: none !important; }
  body[data-stage="investigate"] .story-screen { display: none !important; }
  body:not([data-stage="card"]) .hint,
  body:not([data-stage="card"]) .actions { display: none !important; }
  body:not([data-stage="story"]) .corner-note { display: none; }

  /* ============ STORY ============ */
  .story-screen {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(232, 197, 106, .12), transparent 55%),
      linear-gradient(165deg, #141a28 0%, var(--case) 45%, #12161f 100%);
    overflow: auto;
    touch-action: pan-y;
  }
  .case-file {
    width: min(440px, 100%);
    background: linear-gradient(180deg, #f7f1e4, #efe6d2);
    color: var(--ink);
    border-radius: 6px;
    padding: clamp(22px, 5vw, 34px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08);
    position: relative;
    transform: rotate(-.4deg);
  }
  .case-file::before {
    content: "";
    position: absolute;
    top: 14px; right: 18px;
    width: 64px; height: 64px;
    border: 3px solid rgba(196, 60, 80, .55);
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  .case-stamp {
    position: absolute;
    top: 26px; right: 22px;
    width: 56px; height: 56px;
    border: 2.5px solid rgba(196, 60, 80, .6);
    border-radius: 50%;
    color: rgba(196, 60, 80, .7);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .08em;
    display: grid;
    place-items: center;
    transform: rotate(12deg);
    text-align: center;
    line-height: 1.15;
    pointer-events: none;
  }
  .case-meta {
    font-size: 11px;
    letter-spacing: .22em;
    color: #8a7a5c;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .case-file h1 {
    font-size: clamp(22px, 6vw, 28px);
    letter-spacing: .06em;
    margin-bottom: 4px;
    color: #2c2418;
  }
  .case-sub {
    font-size: 13px;
    color: #7a6a4e;
    margin-bottom: 18px;
    letter-spacing: .12em;
  }
  .case-body {
    font-size: clamp(14px, 3.6vw, 15.5px);
    line-height: 1.85;
    color: #4a3f35;
    border-top: 1px dashed #c9b892;
    padding-top: 14px;
    margin-bottom: 22px;
  }
  .case-body p + p { margin-top: .75em; }
  .case-body .hl { color: #b03050; font-weight: 700; }
  .start-btn {
    width: 100%;
    border: none;
    background: linear-gradient(180deg, #2f3a52, #1e2638);
    color: #f0e6d0;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .18em;
    padding: 15px 20px;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.5);
    transition: transform .15s, filter .2s;
  }
  .start-btn:hover { filter: brightness(1.1); }
  .start-btn:active { transform: scale(.97); }
  .case-foot {
    margin-top: 14px;
    text-align: center;
    font-size: 11px;
    color: #9a8b6a;
    letter-spacing: .14em;
  }

  /* ============ INVESTIGATE ============ */
  .invest-screen {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #2a3148 0%, #3a3348 55%, #4a3a40 100%);
    touch-action: none;
  }
  .invest-screen[hidden] { display: none !important; }
  .invest-hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 16px 10px;
    color: #f0e8d8;
    z-index: 5;
    flex: 0 0 auto;
  }
  .invest-title {
    font-size: clamp(13px, 3.2vw, 15px);
    letter-spacing: .12em;
    font-weight: 700;
  }
  .invest-title small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: .16em;
    color: rgba(240,232,216,.55);
    margin-top: 2px;
  }
  .clue-pill {
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(232,197,106,.45);
    color: var(--gold);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  .room {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    margin: 0 12px 12px;
    border-radius: 14px;
    overflow: hidden;
    background:
      linear-gradient(180deg, #3d4660 0%, #3d4660 62%, #5a463c 62%, #4a3830 100%);
    box-shadow: inset 0 0 60px rgba(0,0,0,.35), 0 12px 30px -12px rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.08);
  }
  /* wall trim */
  .room::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 62%;
    height: 4px;
    background: linear-gradient(90deg, #6a5648, #7d6854, #6a5648);
    z-index: 1;
    pointer-events: none;
  }
  /* vignette */
  .room::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, transparent 40%, rgba(0,0,0,.38) 100%);
    pointer-events: none;
    z-index: 3;
  }

  /* furniture (decor only) */
  .furn { position: absolute; z-index: 2; pointer-events: none; }
  .furn-desk {
    left: 8%; right: 8%; bottom: 8%;
    height: 18%;
    background: linear-gradient(180deg, #8b6914, #6e5210);
    border-radius: 4px 4px 2px 2px;
    box-shadow: 0 8px 16px -6px rgba(0,0,0,.45);
  }
  .furn-desk::before {
    content: "";
    position: absolute;
    left: 6%; right: 6%; top: -10px;
    height: 12px;
    background: linear-gradient(180deg, #a07a1c, #8b6914);
    border-radius: 3px;
  }
  .furn-shelf {
    right: 6%; top: 10%;
    width: 22%; height: 38%;
    background: linear-gradient(90deg, #5c4030, #6e5040);
    border-radius: 3px;
    box-shadow: inset -4px 0 8px rgba(0,0,0,.25);
    border: 2px solid #4a3428;
  }
  .furn-shelf::before, .furn-shelf::after {
    content: "";
    position: absolute;
    left: 8%; right: 8%;
    height: 3px;
    background: #4a3428;
  }
  .furn-shelf::before { top: 32%; }
  .furn-shelf::after  { top: 64%; }
  .furn-window {
    left: 8%; top: 10%;
    width: 28%; height: 30%;
    background: linear-gradient(180deg, #8eb4e0, #c8dff2 60%, #9bb8d4);
    border: 4px solid #5a4a3c;
    border-radius: 2px;
    box-shadow: inset 0 0 20px rgba(255,255,255,.35);
  }
  .furn-window::before {
    content: "";
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 4px;
    background: #5a4a3c;
    transform: translateX(-50%);
  }
  .furn-window::after {
    content: "";
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 4px;
    background: #5a4a3c;
    transform: translateY(-50%);
  }
  .furn-plant {
    left: 6%; bottom: 28%;
    width: 12%; height: 22%;
  }
  .furn-plant::before {
    content: "🪴";
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(28px, 7vmin, 44px);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.35));
  }

  /* hotspots */
  .spot {
    position: absolute;
    z-index: 4;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    width: clamp(56px, 16vmin, 84px);
    height: clamp(56px, 16vmin, 84px);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: clamp(26px, 7vmin, 40px);
    line-height: 1;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.4));
    transition: transform .15s;
    touch-action: manipulation;
  }
  .spot::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(232, 197, 106, .75);
    animation: pulse 2s ease-out infinite;
    pointer-events: none;
  }
  .spot:hover { transform: scale(1.08); }
  .spot:active { transform: scale(.94); }
  .spot.found {
    opacity: .45;
    filter: grayscale(.4) drop-shadow(0 2px 4px rgba(0,0,0,.3));
  }
  .spot.found::before { animation: none; opacity: 0; }
  .spot .tag {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: .06em;
    color: rgba(255,255,255,.85);
    background: rgba(0,0,0,.45);
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
    font-family: inherit;
    pointer-events: none;
  }
  @keyframes pulse {
    0%   { transform: scale(.85); opacity: .9; }
    70%  { transform: scale(1.2); opacity: 0; }
    100% { transform: scale(1.2); opacity: 0; }
  }

  .spot-calendar  { left: 12%; top: 14%; }
  .spot-frame     { left: 42%; top: 12%; }
  .spot-notebook  { left: 30%; bottom: 22%; }
  .spot-lamp      { right: 30%; bottom: 24%; }
  .spot-books     { right: 8%; top: 16%; }

  /* envelope hotspot — hidden until enough clues */
  .spot-envelope {
    left: 50%; top: 48%;
    transform: translate(-50%, -50%);
    width: clamp(72px, 20vmin, 100px);
    height: clamp(72px, 20vmin, 100px);
    font-size: clamp(36px, 10vmin, 54px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s, transform .5s;
  }
  .spot-envelope::before { border-color: rgba(212, 82, 110, .85); }
  .spot-envelope.ready {
    opacity: 1;
    pointer-events: auto;
    animation: env-glow 1.6s ease-in-out infinite;
  }
  .spot-envelope.ready:hover { transform: translate(-50%, -50%) scale(1.08); }
  .spot-envelope.ready:active { transform: translate(-50%, -50%) scale(.94); }
  @keyframes env-glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(212,82,110,.55)); }
    50%      { filter: drop-shadow(0 0 22px rgba(212,82,110,.95)); }
  }

  .spot-envelope .tag { bottom: -6px; color: #ffd6e0; }

  /* toast */
  .clue-toast {
    position: absolute;
    left: 50%; bottom: 18px;
    transform: translateX(-50%) translateY(20px);
    width: min(92%, 400px);
    background: rgba(18, 22, 34, .92);
    color: #f0e8d8;
    border: 1px solid rgba(232,197,106,.35);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: clamp(13px, 3.4vw, 14.5px);
    line-height: 1.65;
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,.55);
  }
  .clue-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .clue-toast strong {
    display: block;
    color: var(--gold);
    font-size: 12px;
    letter-spacing: .16em;
    margin-bottom: 6px;
  }
  .clue-toast .ok { color: var(--clue); font-weight: 700; }
  .clue-toast .warn { color: #f0a0b0; font-weight: 700; }

  /* ============ Envelope / Card (existing flow) ============ */
  .envelope {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(78vw, 560px);
    aspect-ratio: 1 / 0.667;
    cursor: pointer;
    animation: env-in .9s cubic-bezier(.2, .8, .25, 1) both,
               env-float 4.5s ease-in-out 1s infinite;
    z-index: 2;
  }

  @keyframes env-in {
    from { opacity: 0; transform: translate(-50%, -42%) scale(.86); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes env-float {
    0%, 100% { margin-top: 0; }
    50%      { margin-top: -10px; }
  }

  .env-back {
    position: absolute;
    inset: 0;
    background: linear-gradient(175deg, #f3e6d0, #eeddc2);
    border: 1px solid var(--paper-edge);
    border-radius: 10px;
    box-shadow: 0 24px 50px -18px rgba(90, 60, 40, .45);
    z-index: 1;
  }

  .env-front {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 55%;
    background: linear-gradient(180deg, var(--paper-front), #f4e5cd);
    clip-path: polygon(0 14%, 50% 0, 100% 14%, 100% 100%, 0 100%);
    z-index: 3;
    pointer-events: auto;
  }
  .env-front::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.06), transparent 30%);
    pointer-events: none;
  }

  .flap {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 54%;
    background: linear-gradient(185deg, var(--paper-flap), #efdcc0);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform .75s cubic-bezier(.45, .05, .2, 1), z-index 0s .38s;
    z-index: 4;
    backface-visibility: visible;
    pointer-events: auto;
  }
  .flap::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.35), transparent 55%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }

  .seal {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: clamp(52px, 11vmin, 72px);
    height: clamp(52px, 11vmin, 72px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ef7f97, var(--seal) 55%, #a83a54);
    box-shadow: 0 6px 16px -4px rgba(140, 40, 70, .55), inset 0 2px 4px rgba(255,255,255,.4);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: clamp(20px, 4vmin, 28px);
    font-weight: 700;
    z-index: 5;
    transition: opacity .35s, transform .45s cubic-bezier(.3, 1.4, .5, 1);
    pointer-events: none;
  }

  [data-state="opening"] .flap,
  [data-state="opened"] .flap,
  [data-state="floating"] .flap {
    transform: rotateX(180deg);
    z-index: 0;
    transition: transform .75s cubic-bezier(.45, .05, .2, 1), z-index 0s .38s;
  }
  [data-state="opening"] .seal,
  [data-state="opened"] .seal,
  [data-state="floating"] .seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.5);
  }

  [data-state="floating"] .envelope {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, -40%) scale(.94);
    transition: opacity .6s .15s, transform .6s .15s, visibility 0s .8s;
    animation: none;
  }

  .card-holder {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 92%;
    perspective: 1400px;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: transform .55s cubic-bezier(.25, 1.2, .4, 1), opacity .45s .25s;
  }

  [data-state="opening"] .card-holder,
  [data-state="opened"] .card-holder {
    opacity: 1;
  }
  [data-state="opened"] .card-holder {
    pointer-events: auto;
    cursor: grab;
    transform: translate(-50%, calc(-50% - 17%));
  }
  .card-holder.dragging { transition: none; cursor: grabbing; }

  .card-holder.docked {
    position: fixed;
    inset: 0;
    left: 0; top: 0; right: 0; bottom: 0;
    margin: auto;
    width: min(88vw, 760px);
    height: max-content;
    transform: none;
    z-index: 20;
    pointer-events: auto;
    cursor: grab;
  }
  .card-holder.docked.dragging { cursor: grabbing; }

  .card-inner {
    position: relative;
    width: 100%;
    aspect-ratio: 1637 / 1017;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2, .8, .2, 1);
  }
  .card-inner.dragging { transition: none; }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: #fff;
    padding: 10px;
    border-radius: 14px;
    box-shadow: 0 22px 34px -12px rgba(70, 45, 35, .38),
                inset 0 0 0 1px rgba(0,0,0,.06);
    overflow: hidden;
  }
  .card-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 7px;
    display: block;
    pointer-events: none;
  }
  .card-face.back { transform: rotateY(180deg); }

  /* ============ UI ============ */
  .hint {
    position: fixed;
    left: 50%;
    bottom: max(88px, calc(env(safe-area-inset-bottom) + 88px));
    transform: translateX(-50%);
    background: rgba(255, 255, 255, .78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--ink);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: clamp(13px, 2.6vmin, 15px);
    letter-spacing: .04em;
    box-shadow: 0 8px 24px -8px rgba(80, 50, 40, .35);
    z-index: 30;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity .4s, transform .4s;
    animation: hint-bob 2.4s ease-in-out infinite;
  }
  @keyframes hint-bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-6px); }
  }
  .hint[hidden] { display: block; opacity: 0; animation: none; }

  [data-state="floating"] .hint {
    top: max(52px, calc(env(safe-area-inset-top) + 52px));
    bottom: auto;
    animation: hint-bob-top 2.4s ease-in-out infinite;
  }
  @keyframes hint-bob-top {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-6px); }
  }

  .actions {
    position: fixed;
    left: 50%;
    bottom: max(38px, calc(env(safe-area-inset-bottom) + 38px));
    transform: translateX(-50%) translateY(20px);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s .3s, transform .5s .3s;
  }
  [data-state="floating"] .actions {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  .download-btn {
    border: none;
    background: rgba(255, 255, 255, .9);
    color: var(--ink);
    font: inherit;
    font-size: clamp(13px, 2.6vmin, 15px);
    font-weight: 600;
    letter-spacing: .04em;
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 10px 26px -8px rgba(80, 50, 40, .45);
    transition: background .2s, transform .15s;
    white-space: nowrap;
  }
  .download-btn:hover { background: #fff; }
  .download-btn:active { transform: scale(.96); }

  .corner-note {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.92);
    font-size: clamp(12px, 2.4vmin, 14px);
    letter-spacing: .18em;
    text-shadow: 0 2px 8px rgba(80, 50, 60, .35);
    z-index: 30;
    pointer-events: none;
  }

  .credit {
    position: fixed;
    left: 50%;
    bottom: max(8px, calc(env(safe-area-inset-bottom) + 8px));
    transform: translateX(-50%);
    color: rgba(255, 255, 255, .72);
    font-size: clamp(10px, 2vmin, 12px);
    letter-spacing: .1em;
    text-shadow: 0 1px 6px rgba(80, 50, 60, .3);
    z-index: 50;
    pointer-events: none;
    white-space: nowrap;
  }
  body[data-stage="story"] .credit,
  body[data-stage="investigate"] .credit { color: rgba(255,255,255,.4); }

  .confetti {
    position: fixed;
    left: 0; top: 0;
    font-size: clamp(18px, 3.4vmin, 26px);
    pointer-events: none;
    z-index: 45;
    animation: confetti-fall 1.6s cubic-bezier(.2, .6, .4, 1) forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translate(0, 0) rotate(0deg) scale(.6); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .envelope { animation: none; }
    .hint { animation: none; }
    .spot::before { animation: none; }
    .spot-envelope.ready { animation: none; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .room { margin: 0 8px 8px; }
    .invest-hud { padding-top: 8px; padding-bottom: 6px; }
  }
</style>
</head>
<body data-stage="story" data-state="closed">

  <!-- ========== STAGE 1: STORY ========== -->
  <div class="story-screen" id="storyScreen">
    <div class="case-file">
      <div class="case-stamp">机密<br>CONFIDENTIAL</div>
      <div class="case-meta">Case File · No. 1115</div>
      <h1>失踪的生日密件</h1>
      <div class="case-sub">代号「香菜」 · 特别搜查令</div>
      <div class="case-body">
        <p>致 调查员 <span class="hl">香菜诡秘</span>：</p>
        <p>明天就是你的生日。黄师傅声称，他把一份「神秘礼物」藏进了这间屋子——却拒绝透露位置。</p>
        <p>现场只留下一句暗语：<span class="hl">「先找到三条线索，密信自会现身。」</span></p>
        <p>仔细搜查每一件物品。祝你好运，侦探。</p>
      </div>
      <button class="start-btn" id="startBtn" type="button">🔍 进入现场 · 开始调查</button>
      <div class="case-foot">EVIDENCE FIRST · SURPRISE LATER</div>
    </div>
  </div>

  <!-- ========== STAGE 2: INVESTIGATE ========== -->
  <div class="invest-screen" id="investScreen" hidden>
    <div class="invest-hud">
      <div class="invest-title">
        现场搜查中
        <small>点击可疑物品收集线索</small>
      </div>
      <div class="clue-pill">线索 <span id="clueCount">0</span> / 3</div>
    </div>

    <div class="room" id="room">
      <div class="furn furn-window"></div>
      <div class="furn furn-shelf"></div>
      <div class="furn furn-desk"></div>
      <div class="furn furn-plant"></div>

      <button class="spot spot-calendar" data-clue="calendar" type="button" aria-label="日历">
        📅<span class="tag">日历</span>
      </button>
      <button class="spot spot-frame" data-clue="frame" type="button" aria-label="相框">
        🖼️<span class="tag">相框</span>
      </button>
      <button class="spot spot-notebook" data-clue="notebook" type="button" aria-label="笔记本">
        📓<span class="tag">笔记本</span>
      </button>
      <button class="spot spot-lamp" data-clue="lamp" type="button" aria-label="台灯">
        💡<span class="tag">台灯</span>
      </button>
      <button class="spot spot-books" data-clue="books" type="button" aria-label="书架">
        📚<span class="tag">书架</span>
      </button>

      <button class="spot spot-envelope" id="envelopeSpot" data-clue="envelope" type="button" aria-label="神秘信封" disabled>
        💌<span class="tag">密信？</span>
      </button>

      <div class="clue-toast" id="clueToast" role="status"></div>
    </div>
  </div>

  <!-- ========== STAGE 3: CARD ========== -->
  <div class="corner-note">给 香 菜 诡 秘 · 生 日 快 乐</div>

  <div class="stage" id="stage">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="打开信封">
      <div class="env-back"></div>
      <div class="card-holder" id="cardHolder">
        <div class="card-inner" id="cardInner">
          <div class="card-face front"><img src="正面.jpg" alt="贺卡正面：Happy Birthday 插画"></div>
          <div class="card-face back"><img src="反面.jpg" alt="贺卡背面：手写生日祝福"></div>
        </div>
      </div>
      <div class="flap"></div>
      <div class="env-front"></div>
      <div class="seal" aria-hidden="true"></div>
    </div>

    <div class="hint" id="hint">✨ 轻点信封，开启惊喜</div>
    <div class="actions">
      <button class="download-btn" id="downloadFront" type="button">⬇️ 下载正面</button>
      <button class="download-btn" id="downloadBack" type="button">⬇️ 下载反面</button>
    </div>
  </div>

  <div class="credit">designed by 黄师傅</div>

<script>
(() => {
  const body = document.body;
  const storyScreen = document.getElementById("storyScreen");
  const investScreen = document.getElementById("investScreen");
  const startBtn = document.getElementById("startBtn");
  const clueCountEl = document.getElementById("clueCount");
  const clueToast = document.getElementById("clueToast");
  const envelopeSpot = document.getElementById("envelopeSpot");

  const NEED = 3;
  const found = new Set();
  let toastTimer = null;

  const CLUES = {
    calendar: {
      title: "线索 · 日历",
      text: "11 月的某一天被红笔重重圈住，旁边写着一个字：<b>「明」</b>。生日，就在明天。",
    },
    frame: {
      title: "线索 · 相框",
      text: "玻璃相框里是两张笑得毫无形象的脸。背面一行小字：<b>「最好的闺蜜，香菜诡秘。」</b>",
    },
    notebook: {
      title: "线索 · 笔记本",
      text: "翻开的一页写着：<b>「礼物藏在房间最中央——别被日常晃了眼。」</b> 黄师傅的字迹。",
    },
    lamp: {
      title: "线索 · 台灯",
      text: "灯罩下压着一张便签：<b>「找到粉红封印了吗？集齐三条线索，它就会出现。」</b>",
    },
    books: {
      title: "线索 · 书架",
      text: "抽出一本《谜题集》，扉页龙飞凤舞：<b>「黄师傅到此一游 —— 生日快乐！」</b>",
    },
    envelope: {
      title: "★ 密信现身",
      text: "桌面上凭空浮出一封粉红火漆封印的信……<b>就是它！</b>",
    },
  };

  /* ---------- stage transitions ---------- */
  function setStage(name) {
    body.dataset.stage = name;
    if (name === "card") {
      // sync hint with card state machine (still "closed")
      hint.textContent = HINTS.closed;
      hint.hidden = false;
    }
  }

  startBtn.addEventListener("click", () => {
    investScreen.hidden = false;
    setStage("investigate");
  });

  function showToast(html) {
    clueToast.innerHTML = html;
    clueToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => clueToast.classList.remove("show"), 3600);
  }

  function refreshEnvelope() {
    if (found.size >= NEED) {
      envelopeSpot.classList.add("ready");
      envelopeSpot.disabled = false;
    }
  }

  investScreen.addEventListener("click", (e) => {
    const spot = e.target.closest(".spot");
    if (!spot || spot.classList.contains("found")) return;
    const key = spot.dataset.clue;

    if (key === "envelope") {
      if (found.size < NEED) {
        showToast(`<strong>还打不开</strong><span class="warn">线索不足——先集齐 ${NEED} 条线索。</span>`);
        return;
      }
      spot.classList.add("found");
      const c = CLUES.envelope;
      showToast(`<strong>${c.title}</strong>${c.text}`);
      burstConfetti();
      setTimeout(() => {
        setStage("card");
        // brief pause so envelope entrance animation plays cleanly
      }, 900);
      return;
    }

    const c = CLUES[key];
    if (!c) return;
    spot.classList.add("found");
    found.add(key);
    clueCountEl.textContent = String(Math.min(found.size, NEED));

    const done = found.size === NEED;
    showToast(
      `<strong>${c.title}</strong>${c.text}` +
      (done ? `<div style="margin-top:8px"><span class="ok">✓ 线索已齐——密信即将出现！</span></div>` : "")
    );
    refreshEnvelope();
  });

  /* ================= card flow (unchanged) ================= */
  const envelope = document.getElementById("envelope");
  const cardHolder = document.getElementById("cardHolder");
  const cardInner = document.getElementById("cardInner");
  const hint = document.getElementById("hint");
  const downloadFront = document.getElementById("downloadFront");
  const downloadBack = document.getElementById("downloadBack");

  let state = "closed";
  let rotY = 0, rotX = 0;

  const HINTS = {
    closed:   "✨ 轻点信封，开启惊喜",
    opening:  "……",
    opened:   "☝️ 按住卡片向上拖出（或点一下）",
    floating: "🖐 用手指旋转看看正反面",
  };

  function setState(s) {
    state = s;
    body.dataset.state = s;
    hint.textContent = HINTS[s] || "";
    hint.hidden = false;
  }

  function openEnvelope() {
    if (body.dataset.stage !== "card") return;
    if (state !== "closed") return;
    setState("opening");
    setTimeout(() => { if (state === "opening") setState("opened"); }, 780);
  }
  envelope.addEventListener("click", openEnvelope);
  envelope.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); }
  });

  let mode = null;
  let lastX = 0, lastY = 0;
  let startY = 0;
  let pullPx = 0;
  let moved = 0;

  const peekY = () => -cardHolder.offsetHeight * 0.17;

  function applyPull(px) {
    pullPx = px;
    cardHolder.style.transform =
      `translate(-50%, calc(-50% + ${peekY()}px + ${px}px))`;
  }

  function completePull() {
    const first = cardHolder.getBoundingClientRect();
    document.getElementById("stage").appendChild(cardHolder);
    cardHolder.classList.add("docked");
    cardHolder.style.transition = "none";
    cardHolder.style.transform = "";
    cardHolder.style.opacity = "1";

    setState("floating");

    const last = cardHolder.getBoundingClientRect();
    const dx = first.left - last.left;
    const dy = first.top - last.top;
    const s  = first.width / last.width;

    cardHolder.style.transformOrigin = "top left";
    cardHolder.style.transform = `translate(${dx}px, ${dy}px) scale(${s})`;

    requestAnimationFrame(() => {
      cardHolder.style.transition = "transform .75s cubic-bezier(.2, .85, .25, 1)";
      cardHolder.style.transform = "translate(0px, 0px) scale(1)";
      setTimeout(() => {
        cardHolder.style.transition = "";
        cardHolder.style.transformOrigin = "";
        cardHolder.style.transform = "";
      }, 800);
    });

    burstConfetti();
  }

  function springBack() {
    cardHolder.style.transform = "";
    pullPx = 0;
  }

  function applyRotation() {
    cardInner.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  function snapRotation() {
    rotY = Math.round(rotY / 180) * 180;
    rotX = 0;
    applyRotation();
  }

  function flip() {
    rotY = Math.round(rotY / 180) * 180 + 180;
    rotX = 0;
    applyRotation();
  }

  function downloadImage(href, name) {
    const a = document.createElement("a");
    a.href = href;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  downloadFront.addEventListener("click", (e) => {
    e.stopPropagation();
    downloadImage("正面.jpg", "贺卡-正面.jpg");
  });
  downloadBack.addEventListener("click", (e) => {
    e.stopPropagation();
    downloadImage("反面.jpg", "贺卡-反面.jpg");
  });

  cardHolder.addEventListener("pointerdown", (e) => {
    if (body.dataset.stage !== "card") return;
    if (state === "opened") {
      mode = "pull";
      startY = e.clientY;
      pullPx = 0;
      moved = 0;
      lastX = e.clientX; lastY = e.clientY;
      cardHolder.classList.add("dragging");
      cardHolder.style.transition = "none";
      cardHolder.setPointerCapture(e.pointerId);
    } else if (state === "floating") {
      mode = "rotate";
      lastX = e.clientX; lastY = e.clientY;
      moved = 0;
      cardHolder.classList.add("dragging");
      cardInner.classList.add("dragging");
      cardHolder.setPointerCapture(e.pointerId);
    }
  });

  cardHolder.addEventListener("pointermove", (e) => {
    if (!mode) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);

    if (mode === "pull") {
      const delta = e.clientY - startY;
      applyPull(Math.min(0, delta));
    } else if (mode === "rotate") {
      rotY += dx * 0.55;
      rotX = Math.max(-28, Math.min(28, rotX - dy * 0.25));
      applyRotation();
      lastX = e.clientX; lastY = e.clientY;
    }
  });

  function endPointer(e) {
    if (!mode) return;
    const m = mode;
    mode = null;

    if (m === "pull") {
      cardHolder.classList.remove("dragging");
      cardHolder.style.transition = "";
      const cardH = cardHolder.offsetHeight;
      if (moved < 10) {
        completePull();
      } else if (-pullPx > cardH * 0.38) {
        completePull();
      } else {
        springBack();
      }
    } else if (m === "rotate") {
      cardHolder.classList.remove("dragging");
      cardInner.classList.remove("dragging");
      if (moved < 8) {
        flip();
      } else {
        snapRotation();
      }
    }
  }
  cardHolder.addEventListener("pointerup", endPointer);
  cardHolder.addEventListener("pointercancel", endPointer);

  function burstConfetti() {
    const emojis = ["🎂", "✨", "🎀", "🥳", "💛", "🌸", "🎉"];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 26; i++) {
      const el = document.createElement("span");
      el.className = "confetti";
      el.textContent = emojis[i % emojis.length];
      const angle = (Math.PI * 2 * i) / 26 + Math.random() * 0.5;
      const dist = 120 + Math.random() * 220;
      el.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
      el.style.setProperty("--dy", `${Math.sin(angle) * dist * 0.7 + 140}px`);
      el.style.setProperty("--rot", `${(Math.random() * 540 - 270) | 0}deg`);
      el.style.left = cx + (Math.random() * 80 - 40) + "px";
      el.style.top = cy + (Math.random() * 40 - 20) + "px";
      el.style.animationDelay = Math.random() * 0.15 + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }
  }

  applyRotation();
})();
</script>
</body>
</html>
